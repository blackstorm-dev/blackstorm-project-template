# make init replaces the placeholder with the public recipient from age.key.
creation_rules:
- path_regex: ^secrets/platform/.*\.ya?ml$
  encrypted_regex: ^(data|stringData)$
  age: REPLACE_WITH_AGE_PUBLIC_KEY
- path_regex: ^deploy/[^/]+/secrets/.*\.ya?ml$
  encrypted_regex: ^(data|stringData)$
  age: REPLACE_WITH_AGE_PUBLIC_KEY
- path_regex: ^secrets/.*\.env$
  age: REPLACE_WITH_AGE_PUBLIC_KEY
