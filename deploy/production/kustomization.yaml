apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- secrets/dockerhub.yaml
- secrets/app.yaml
patches:
- target:
    group: gateway.networking.k8s.io
    version: v1
    kind: HTTPRoute
    name: app
  patch: |-
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: app
      annotations:
        gatus.home-operations.com/endpoint: |
          name: project-template-production
          path: /healthz
    spec:
      hostnames:
        - project-template-production.localhost
